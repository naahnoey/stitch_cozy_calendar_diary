<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Morning Garden Diary - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700&amp;family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-fixed-variant": "#624000",
                      "surface-tint": "#815500",
                      "outline-variant": "#d4c4b2",
                      "on-error": "#ffffff",
                      "surface-container-low": "#fbf4db",
                      "tertiary": "#59623e",
                      "on-tertiary-container": "#515a36",
                      "primary-fixed": "#ffddb2",
                      "on-tertiary": "#ffffff",
                      "surface-variant": "#e9e3ca",
                      "on-background": "#1e1c0d",
                      "primary-fixed-dim": "#f8bc61",
                      "inverse-on-surface": "#f8f1d8",
                      "on-primary-container": "#764e00",
                      "on-secondary-fixed-variant": "#424a25",
                      "secondary-container": "#dee8b5",
                      "secondary": "#59623b",
                      "surface": "#fff9e9",
                      "on-secondary": "#ffffff",
                      "on-tertiary-fixed": "#171e03",
                      "tertiary-fixed-dim": "#c1cb9f",
                      "outline": "#827565",
                      "secondary-fixed-dim": "#c2cb9b",
                      "surface-dim": "#e1dac2",
                      "on-error-container": "#93000a",
                      "tertiary-fixed": "#dde7b9",
                      "inverse-primary": "#f8bc61",
                      "inverse-surface": "#343120",
                      "on-secondary-container": "#5f6840",
                      "on-surface-variant": "#504537",
                      "surface-container-lowest": "#ffffff",
                      "surface-bright": "#fff9e9",
                      "primary-container": "#fec166",
                      "on-tertiary-fixed-variant": "#424a28",
                      "primary": "#815500",
                      "tertiary-container": "#c7d1a4",
                      "surface-container-high": "#efe8d0",
                      "error-container": "#ffdad6",
                      "surface-container": "#f5eed5",
                      "background": "#fff9e9",
                      "secondary-fixed": "#dee8b5",
                      "surface-container-highest": "#e9e3ca",
                      "error": "#ba1a1a",
                      "on-primary": "#ffffff",
                      "on-primary-fixed": "#291800",
                      "on-secondary-fixed": "#171e01",
                      "on-surface": "#1e1c0d"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "8px",
                      "card-gap": "2rem",
                      "gutter": "1.5rem",
                      "container-padding": "2rem"
              },
              "fontFamily": {
                      "label-sm": ["Nunito Sans"],
                      "headline-md": ["Quicksand"],
                      "body-lg": ["Quicksand"],
                      "headline-lg-mobile": ["Quicksand"],
                      "headline-lg": ["Quicksand"],
                      "body-md": ["Quicksand"]
              },
              "fontSize": {
                      "label-sm": ["13px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "500"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "headline-lg": ["36px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            overflow-x: hidden;
        }
        
        .cloud-shadow {
            box-shadow: 0px 10px 30px rgba(113, 105, 85, 0.08);
        }

        .cloud-shadow-hover:hover {
            box-shadow: 0px 15px 35px rgba(113, 105, 85, 0.12);
            transform: translateY(-2px);
        }

        /* Whimsical Motifs */
        .motif-leaf {
            position: absolute;
            opacity: 0.6;
            color: theme('colors.secondary-container');
            z-index: 0;
            pointer-events: none;
        }
        
        .motif-star {
            position: absolute;
            opacity: 0.5;
            color: theme('colors.primary-container');
            z-index: 0;
            pointer-events: none;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.9) rotate(0deg); }
            100% { opacity: 0.8; transform: scale(1.1) rotate(15deg); }
        }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative font-body-md text-body-md">
<!-- Decorative Background Elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<span class="material-symbols-outlined motif-leaf text-[64px] floating" style="top: 10%; left: 15%; color: #dee8b5;">local_florist</span>
<span class="material-symbols-outlined motif-star text-[48px]" style="top: 25%; right: 20%; color: #fec166;">auto_awesome</span>
<span class="material-symbols-outlined motif-leaf text-[80px] floating" style="bottom: 15%; right: 10%; animation-delay: 2s; color: #dee8b5; transform: rotate(-45deg);">nest_eco_leaf</span>
<span class="material-symbols-outlined motif-star text-[32px]" style="bottom: 20%; left: 25%; animation-delay: 1s; color: #fec166;">auto_awesome</span>
<!-- Large soft blobs for background depth -->
<div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-surface-container-low blur-[80px] opacity-60"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-surface-container-low blur-[100px] opacity-60"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[480px] px-gutter md:px-0 mx-auto">
<div class="bg-surface-container-lowest rounded-xl p-8 md:p-12 cloud-shadow transition-all duration-300">
<!-- Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-highest text-primary mb-6">
<span class="material-symbols-outlined text-[32px]">potted_plant</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">
                    Welcome Back to Your Garden
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Step inside to nurture your thoughts and memories.
                </p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container rounded-lg border-none text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-colors" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-container transition-colors" href="#">Forgot seed phrase?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container rounded-lg border-none text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full flex items-center justify-center space-x-2 py-4 px-6 bg-primary-container text-on-primary rounded-full font-label-sm text-label-sm hover:bg-inverse-primary hover:text-on-primary-container transition-colors cloud-shadow-hover" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer -->
<div class="mt-8 text-center pt-8 border-t border-surface-container-highest border-dashed">
<p class="text-on-surface-variant font-body-md text-body-md">
                    New to the garden? 
                    <a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-container underline decoration-secondary-container decoration-2 underline-offset-4 transition-colors" href="#">
                        Create an account
                    </a>
</p>
</div>
<!-- Inner decorative corner leaf -->
<span class="material-symbols-outlined absolute top-4 right-4 text-surface-container-highest pointer-events-none transform rotate-12">spa</span>
</div>
</main>
<script>
        // Simple script to handle password visibility toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.querySelector('button[type="button"]');
            const passwordInput = document.getElementById('password');
            const visibilityIcon = toggleButton.querySelector('.material-symbols-outlined');

            if(toggleButton && passwordInput && visibilityIcon) {
                toggleButton.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    visibilityIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
                });
            }
        });
    </script>
</body></html>
