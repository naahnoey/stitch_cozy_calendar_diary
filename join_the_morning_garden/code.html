<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Morning Garden Diary - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700&amp;family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#624000",
                        "surface-tint": "#815500",
                        "outline-variant": "#d4c4b2",
                        "on-error": "#ffffff",
                        "surface-container-low": "#fbf4db",
                        "tertiary": "#59623e",
                        "on-tertiary-container": "#515a36",
                        "primary-fixed": "#ffddb2",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e9e3ca",
                        "on-background": "#1e1c0d",
                        "primary-fixed-dim": "#f8bc61",
                        "inverse-on-surface": "#f8f1d8",
                        "on-primary-container": "#764e00",
                        "on-secondary-fixed-variant": "#424a25",
                        "secondary-container": "#dee8b5",
                        "secondary": "#59623b",
                        "surface": "#fff9e9",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#171e03",
                        "tertiary-fixed-dim": "#c1cb9f",
                        "outline": "#827565",
                        "secondary-fixed-dim": "#c2cb9b",
                        "surface-dim": "#e1dac2",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#dde7b9",
                        "inverse-primary": "#f8bc61",
                        "inverse-surface": "#343120",
                        "on-secondary-container": "#5f6840",
                        "on-surface-variant": "#504537",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fff9e9",
                        "primary-container": "#fec166",
                        "on-tertiary-fixed-variant": "#424a28",
                        "primary": "#815500",
                        "tertiary-container": "#c7d1a4",
                        "surface-container-high": "#efe8d0",
                        "error-container": "#ffdad6",
                        "surface-container": "#f5eed5",
                        "background": "#fff9e9",
                        "secondary-fixed": "#dee8b5",
                        "surface-container-highest": "#e9e3ca",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#291800",
                        "on-secondary-fixed": "#171e01",
                        "on-surface": "#1e1c0d"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "card-gap": "2rem",
                        "gutter": "1.5rem",
                        "container-padding": "2rem"
                    },
                    "fontFamily": {
                        "label-sm": ["Nunito Sans"],
                        "headline-md": ["Quicksand"],
                        "body-lg": ["Quicksand"],
                        "headline-lg-mobile": ["Quicksand"],
                        "headline-lg": ["Quicksand"],
                        "body-md": ["Quicksand"]
                    },
                    "fontSize": {
                        "label-sm": ["13px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "500"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "headline-lg": ["36px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .cloud-shadow {
            box-shadow: 0px 10px 30px rgba(113, 105, 85, 0.08);
        }
        .cloud-shadow-hover:hover {
            box-shadow: 0px 14px 40px rgba(113, 105, 85, 0.12);
            transform: translateY(-2px);
        }
        
        /* Subtle float animation for decorative elements */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .animate-float-delayed {
            animation: float 7s ease-in-out infinite 1s;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-gutter relative overflow-hidden font-body-md">
<!-- Decorative Elements (Background) -->
<div class="absolute top-10 left-10 text-secondary opacity-30 animate-float pointer-events-none hidden md:block">
<svg fill="currentColor" height="64" viewbox="0 0 24 24" width="64" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"></path>
</svg>
</div>
<div class="absolute bottom-20 right-10 text-primary opacity-20 animate-float-delayed pointer-events-none hidden md:block">
<svg fill="currentColor" height="80" viewbox="0 0 24 24" width="80" xmlns="http://www.w3.org/2000/svg">
<path d="M17.5 10.5C17.5 10.5 15.5 14.5 12 14.5C8.5 14.5 6.5 10.5 6.5 10.5C6.5 10.5 8.5 6.5 12 6.5C15.5 6.5 17.5 10.5 17.5 10.5Z"></path>
<path d="M12 2L12 6.5" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
</svg>
</div>
<div class="absolute top-1/4 right-1/4 text-tertiary-container opacity-40 animate-float pointer-events-none">
<svg fill="currentColor" height="40" viewbox="0 0 24 24" width="40" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="4"></circle>
</svg>
</div>
<!-- Main Signup Card -->
<div class="bg-surface-container-lowest rounded-xl cloud-shadow cloud-shadow-hover transition-all duration-300 w-full max-w-[480px] p-container-padding relative z-10">
<!-- Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-secondary-container text-on-secondary-container mb-6 animate-float-delayed">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">local_florist</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">Start Your Journey Today</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Join Morning Garden Diary</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Name Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-4" for="name">Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
<span class="material-symbols-outlined">person</span>
</span>
<input class="w-full bg-surface-container rounded-full py-4 pl-12 pr-4 border-none focus:ring-2 focus:ring-primary-container text-on-background placeholder-outline font-body-md text-body-md transition-shadow" id="name" name="name" placeholder="Evelyn Wood" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-4" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
<span class="material-symbols-outlined">mail</span>
</span>
<input class="w-full bg-surface-container rounded-full py-4 pl-12 pr-4 border-none focus:ring-2 focus:ring-primary-container text-on-background placeholder-outline font-body-md text-body-md transition-shadow" id="email" name="email" placeholder="evelyn@garden.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-4" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
<span class="material-symbols-outlined">lock</span>
</span>
<input class="w-full bg-surface-container rounded-full py-4 pl-12 pr-4 border-none focus:ring-2 focus:ring-primary-container text-on-background placeholder-outline font-body-md text-body-md transition-shadow" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary font-label-sm text-label-sm rounded-full py-4 px-8 hover:bg-primary-fixed-dim transition-colors duration-300 shadow-md flex items-center justify-center gap-2 active:scale-95 transform" type="button">
                    Sign Up
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Footer Link -->
<div class="text-center pt-4">
<a class="font-body-md text-body-md text-primary hover:text-surface-tint transition-colors flex items-center justify-center gap-2" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    Back to login
                </a>
</div>
</form>
</div>
</body></html>
